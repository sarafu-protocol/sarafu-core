version: "3.8"

services:
  validator-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: sarafu-validator-1
    hostname: validator-1
    ports:
      - "26656:26656"
      - "9090:9090"
      - "8080:8080"
    volumes:
      - validator-1-data:/data
      - ./configs/validator-1.toml:/data/config.toml:ro
    networks:
      sarafu-testnet:
        ipv4_address: 172.25.0.11
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  validator-2:
    build:
