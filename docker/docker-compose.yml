version: "3.8"

services:
  validator-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: sarafu-validator-1
    hostname: validator-1
    ports:
      - "26656:26656"
      - "9090:9090"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - validator-1-data:/data
      - ./configs/validator-1.toml:/data/config.toml:ro
      - ./keys/validator-1:/data/keys:ro
      - ./genesis.json:/data/genesis.json:ro
    networks:
      sarafu-testnet:
        ipv4_address: 172.25.0.11
    restart: unless-stopped
    environment:
      - SARAFU_STORAGE_DATA_DIRECTORY=/data
      - SARAFU_CHAIN_ID=sarafu-testnet-1
      - VALIDATOR_MODE=true
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/26656' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    stop_signal: SIGTERM

  validator-2:
