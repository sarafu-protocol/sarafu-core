# Sarafu Blockchain Configuration - Validator 1

[network]
listen_address = "0.0.0.0:26656"
bootstrap_peers = ["/ip4/validator-2/tcp/26656", "/ip4/validator-3/tcp/26656"]

[rpc]
grpc_port = 9090
rest_port = 8080
websocket_port = 8081

[storage]
data_dir = "/data"

[validator]
enabled = true
consensus_key_path = "/data/keys/consensus_key.bin"
withdrawal_key_path = "/data/keys/withdrawal_key.bin"

[genesis]
genesis_file_path = "/data/genesis.json"

[logging]
level = "info"
format = "json"
