# Sarafu Blockchain Configuration - Validator 9

[network]
listen_address = "0.0.0.0:26656"
bootstrap_peers = [
    "/ip4/validator-1/tcp/26656",
    "/ip4/validator-8/tcp/26656",
    "/ip4/validator-10/tcp/26656"
]

[rpc]
grpc_port = 9090
rest_port = 8080
websocket_port = 8081

[storage]
data_dir = "/data"

[validator]
enabled = true
consensus_key_path = "/data/keys/consensus_key.bin"
withdrawal_key_path = "/data/keys/withdrawal_key.bin"

[logging]
level = "info"
format = "json"
