# Sarafu Blockchain - Testnet Configuration

[chain]
chain_id = 2

[network]
listen_address = "0.0.0.0:30303"
bootstrap_peers = [
    "/ip4/testnet-seed1.sarafu.network/tcp/30303",
    "/ip4/testnet-seed2.sarafu.network/tcp/30303"
]
min_peers = 4
max_peers = 30
gossip_fanout = 8

[rpc]
grpc_address = "0.0.0.0:50051"
rest_address = "0.0.0.0:8080"
websocket_address = "0.0.0.0:8081"
enable_grpc = true
enable_rest = true
enable_websocket = true
enable_rate_limiting = true
max_requests_per_minute = 200
enable_authentication = false

[storage]
data_directory = "./data/testnet"
enable_pruning = true
pruning_keep_blocks = 500000

[validator]
# Set to true if this node is a validator
is_validator = false
# Path to BLS12-381 consensus key (required for validators)
consensus_key_path = ""
# Path to Ed25519 withdrawal key (required for validators)
withdrawal_key_path = ""

[genesis]
genesis_file_path = "./genesis.testnet.json"

[log]
log_level = "DEBUG"
log_file = "./logs/testnet-node.log"
enable_structured_logging = true

[consensus]
block_time_ms = 2000
view_change_timeout_ms = 10000
epoch_length = 10000
