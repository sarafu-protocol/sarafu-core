# Sarafu Blockchain - Mainnet Configuration

[chain]
chain_id = 1

[network]
listen_address = "0.0.0.0:30303"
bootstrap_peers = [
    "/ip4/mainnet-seed1.sarafu.network/tcp/30303",
    "/ip4/mainnet-seed2.sarafu.network/tcp/30303",
    "/ip4/mainnet-seed3.sarafu.network/tcp/30303"
]
min_peers = 8
max_peers = 50
gossip_fanout = 8

[rpc]
grpc_address = "0.0.0.0:50051"
rest_address = "0.0.0.0:8080"
websocket_address = "0.0.0.0:8081"
enable_grpc = true
enable_rest = true
enable_websocket = true
enable_rest_tls = true
enable_websocket_tls = true
tls_cert_path = "/etc/sarafu/tls/server.crt"
tls_key_path = "/etc/sarafu/tls/server.key"
tls_ca_path = ""
tls_require_client_auth = false
enable_rate_limiting = true
max_requests_per_minute = 100
enable_authentication = false

[storage]
data_directory = "/var/lib/sarafu/mainnet"
enable_pruning = true
pruning_keep_blocks = 1000000

[validator]
# Set to true if this node is a validator
is_validator = false
# Path to BLS12-381 consensus key (required for validators)
consensus_key_path = ""
# Path to Ed25519 withdrawal key (required for validators)
withdrawal_key_path = ""

[genesis]
genesis_file_path = "/etc/sarafu/genesis.mainnet.json"

[log]
log_level = "INFO"
log_file = "/var/log/sarafu/node.log"
enable_structured_logging = true

[consensus]
block_time_ms = 2000
view_change_timeout_ms = 10000
epoch_length = 10000
