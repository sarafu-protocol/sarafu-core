name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-audit:
    name: Code Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run code audit
        run: |
          chmod +x scripts/audit-code.sh
          ./scripts/audit-code.sh

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-audit-report
          path: docs/CODE_AUDIT_REPORT.md
          retention-days: 30

  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    needs: code-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/install-deps-ubuntu.sh
          ./scripts/install-deps-ubuntu.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/install-deps-macos.sh
          ./scripts/install-deps-macos.sh

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cd build
          cmake --build . --config ${{ matrix.build_type }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Run unit tests
        if: matrix.build_type == 'Debug'
        run: |
          cd build
          ctest --output-on-failure --config ${{ matrix.build_type }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: code-audit
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          chmod +x scripts/install-deps-ubuntu.sh
          ./scripts/install-deps-ubuntu.sh

      - name: Configure CMake with coverage
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build with coverage
        run: |
          cd build
          cmake --build . -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Generate coverage report
        run: |
          if [ -f scripts/generate-coverage.sh ]; then
            chmod +x scripts/generate-coverage.sh
            ./scripts/generate-coverage.sh
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/
          retention-days: 30
